[tools]
bun = "1.4.3"
node = "24.22.0"
oxfmt = "0.73.0"

[tasks.install]
description = "Install dependencies from bun.lock without resolving"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Check code with Biome and Markdown and YAML with oxfmt"
run = ["bun x biome check .", "oxfmt --check '**/*.md' '**/*.yml'"]

[tasks.fix]
description = "Apply safe Biome fixes and format code, Markdown and YAML"
run = ["bun x biome check --write .", "oxfmt '**/*.md' '**/*.yml'"]

[tasks.typecheck]
description = "Typecheck with tsc"
run = "bun x tsc -p tsconfig.json --noEmit"

[tasks.test]
description = "Run the offline replay tests"
run = "bun test tests/replay"

[tasks."test:update"]
description = "Accept intended replay snapshot changes"
run = "bun test tests/replay --update-snapshots"

[tasks."test:coverage"]
description = "Run the replay tests and write coverage/lcov.info"
run = "bun test tests/replay --coverage --coverage-reporter=lcov"

[tasks.build]
description = "Bundle the package into dist"
run = ["rm -rf dist", "bun x bunup"]

[tasks.check]
description = "Run lint, typecheck, test and build; tracked files stay unchanged and build writes the ignored dist/"
depends = ["lint", "typecheck", "test", "build"]

[tasks.eval]
description = "Print fixture results from the committed cassettes"
run = "bun scripts/eval.ts"

[tasks."eval:live"]
description = "Check the Instagram fixtures against the live site"
run = "bun scripts/eval.ts --live instagram"

[tasks.record]
description = "Refresh cassettes from a live platform, for example: mise run record instagram"
run = "bun --env-file=.env scripts/record.ts"

[tasks.release]
description = "Run every check, then publish the package to npm"
depends = ["check"]
run = "npm publish"
