name: Biome CI

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "**/*.ts"
  pull_request:
    branches:
      - "master"
    paths:
      - "**/*.ts"

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: biomejs/setup-biome@1efcadc959a0c3339b8a5a6f521a98c1a6bd672f # v2.7.1
        with:
          version: "2.5.2"

      - run: biome ci .
