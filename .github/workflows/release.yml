name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: publishing

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - uses: biomejs/setup-biome@21f9d12eb1adf00171b25b251de1539a153e416f # v2.7.1
        with:
          version: "2.5.2"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      # prepublishOnly runs the typecheck, which needs @types/node and
      # @types/bun from node_modules.
      - run: bun install --frozen-lockfile

      # npm publish relies on prepublishOnly to build publish artifacts.
      - run: npm publish

  github:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@b5a645e6d7f681d09866ab86ba7918b222989555 # v3.0.3
        with:
          generate_release_notes: true
