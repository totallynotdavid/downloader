name: release

# A tag publishes. A pull request or a manual run from a branch runs the same
# jobs and skips only the ones that publish.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      deployments: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that every environment a job names exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(yq '.jobs[].environment | select(. != null) | (.name // .)' .github/workflows/release.yml)
          if [ -z "$names" ]; then
            echo "No job names an environment" >&2
            exit 1
          fi
          for name in $names; do
            gh api "repos/$GITHUB_REPOSITORY/environments/$name" --jq '"environment " + .name + " exists"'
          done

  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the manifest
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Check the release notes against the manifest
        run: |
          name=$(jq -r .name package.json)
          version=$(jq -r .version package.json)
          first=$(head -n 1 .github/release-notes.md)
          if [ "$first" != "$name $version is out." ]; then
            echo "First line of .github/release-notes.md is '$first', expected '$name $version is out.'" >&2
            exit 1
          fi

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - run: bun install --frozen-lockfile

      - run: bun run check

      - name: Pack the package
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [preflight, verify]
    runs-on: ubuntu-latest

    environment:
      name: publishing

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      - run: npm publish "$RUNNER_TEMP"/package/*.tgz

  github:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: .github/release-notes.md
          generate_release_notes: true
